name: Build APK desde ZIP

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK requerido
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Descomprimir ZIP del proyecto
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -iname "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "No se encontro ningun ZIP en la raiz del repositorio"
            exit 1
          fi
          echo "ZIP encontrado: $ZIP_FILE"
          rm -rf source
          mkdir source
          unzip -q "$ZIP_FILE" -d source
          ls -la source

      - name: Corregir dependencia FFmpeg
        run: |
          sed -i 's/com.arthenica:ffmpeg-kit-full-gpl:6.0-2/com.arthenica:ffmpeg-kit-full-gpl:6.0-2.LTS/g' source/app/build.gradle
          cat source/app/build.gradle

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Compilar APK
        working-directory: source
        run: gradle assembleDebug --no-daemon

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: AnimeHDCleaner-debug-apk
          path: source/app/build/outputs/apk/debug/*.apk
